name: Atlas CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas:
    name: Atlas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        id: atlas-cache
        with:
          path: ~/.cargo/bin/atlas
          key: atlas-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json') }}
      - if: steps.atlas-cache.outputs.cache-hit != 'true'
        run: npm run atlas:install
      - name: Require zero findings across the entire repository
        shell: bash
        run: |
          set -o pipefail
          atlas check --f . --format json | tee "$RUNNER_TEMP/atlasReport.json"
          jq -e '.findings == []' "$RUNNER_TEMP/atlasReport.json"
