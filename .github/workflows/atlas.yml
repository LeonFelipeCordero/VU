name: Atlas CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas:
    name: Atlas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install latest Atlas release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/atlas"
          gh release download --repo LeonFelipeCordero/atlas \
            --pattern 'atlas-*-x86_64-unknown-linux-gnu.tar.gz' \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/atlas"
          cd "$RUNNER_TEMP/atlas"
          sha256sum --check SHA256SUMS
          tar -xzf atlas-*-x86_64-unknown-linux-gnu.tar.gz atlas
          echo "$RUNNER_TEMP/atlas" >> "$GITHUB_PATH"
      - name: Require zero findings across the entire repository
        shell: bash
        run: |
          set -o pipefail
          atlas check --f . --format json | tee "$RUNNER_TEMP/atlasReport.json"
          jq -e '.findings == []' "$RUNNER_TEMP/atlasReport.json"
